<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵小雷的工作台</title>
<style>
  :root{
    --bg:#eef0f7;
    --card:rgba(255,255,255,.58);
    --text:#1f2430;
    --muted:#7a8090;
    --accent:#4f7cff;
    --accent-soft:rgba(79,124,255,.12);
    --shadow:0 8px 32px rgba(31,38,135,.10);
    --radius:22px;
    --glass-border:1px solid rgba(255,255,255,.65);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:
      radial-gradient(820px 560px at 8% 6%, rgba(122,165,255,.55) 0%, transparent 60%),
      radial-gradient(900px 600px at 92% 12%, rgba(183,140,255,.48) 0%, transparent 62%),
      radial-gradient(860px 620px at 88% 92%, rgba(255,154,196,.42) 0%, transparent 60%),
      radial-gradient(760px 540px at 12% 88%, rgba(255,210,154,.45) 0%, transparent 58%),
      linear-gradient(160deg, #eef2fb 0%, #f4effa 50%, #fdf2f4 100%);
    min-height:100vh;color:var(--text);
    display:flex;flex-direction:column;align-items:center;
    position:relative;
  }
  /* ===== 动态光斑背景 ===== */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .blob{
    position:absolute;border-radius:50%;
    filter:blur(70px);opacity:.55;
    animation:drift 26s ease-in-out infinite alternate;
    will-change:transform;
  }
  .b1{width:520px;height:520px;background:#7aa5ff;top:-140px;left:-120px;animation-duration:11s}
  .b2{width:560px;height:560px;background:#b78cff;top:-100px;right:-160px;animation-duration:14s;animation-delay:-3s}
  .b3{width:480px;height:480px;background:#ff9ac4;bottom:-160px;right:6%;animation-duration:12s;animation-delay:-6s}
  .b4{width:460px;height:460px;background:#ffd29a;bottom:-140px;left:4%;animation-duration:15s;animation-delay:-9s}
  .b5{width:380px;height:380px;background:#8de8c9;top:34%;left:38%;opacity:.4;animation-duration:17s;animation-delay:-5s}
  @keyframes drift{
    0%  {transform:translate(0,0) scale(1)}
    33% {transform:translate(150px,-110px) scale(1.16)}
    66% {transform:translate(-130px,130px) scale(.9)}
    100%{transform:translate(90px,-70px) scale(1.1)}
  }
  @media (prefers-reduced-motion: reduce){
    .blob{animation:none}
  }

  header,.note-wrap,.stage,footer{position:relative;z-index:1}
  body{overflow-x:hidden}

  /* ===== 顶部 ===== */
  header{
    width:100%;max-width:1080px;
    padding:42px 24px 18px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .hello h1{font-size:26px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:14px}
  .hello h1 .avatar{
    width:58px;height:58px;border-radius:16px;object-fit:cover;flex-shrink:0;
    border:3px solid #fff;
    box-shadow:0 6px 18px rgba(35,45,80,.18), 0 0 0 3px rgba(79,124,255,.15);
    transition:transform .3s cubic-bezier(.2,.8,.3,1.4);
  }
  .hello h1 .avatar:hover{transform:scale(1.08) rotate(-3deg)}
  .hello p{color:var(--muted);font-size:13px;margin-top:6px}
  .clock{text-align:right}
  .clock .time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  .clock .date{color:var(--muted);font-size:13px;margin-top:2px}
  /* ===== 视图容器 ===== */
  .stage{width:100%;max-width:1080px;padding:20px 24px 60px;position:relative;flex:1}
  .view{transition:opacity .35s ease, transform .35s ease}
  .view.leaving{opacity:0;transform:translateY(14px) scale(.98);pointer-events:none}
  .view.entering{opacity:0;transform:translateY(-10px) scale(.99)}
  /* ===== 面包屑 ===== */
  .crumb{
    display:flex;align-items:center;gap:10px;margin:6px 0 18px;
    opacity:0;animation:fadeDown .4s .05s forwards;
  }
  .back{
    border:var(--glass-border);cursor:pointer;background:var(--card);color:var(--text);
    width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);
    backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    transition:transform .2s, background .2s;
  }
  .back:hover{transform:translateX(-3px);background:rgba(255,255,255,.85)}
  .crumb .path{font-size:15px;font-weight:600}
  .crumb .count{font-size:12px;color:var(--muted);background:var(--card);
    padding:4px 12px;border-radius:99px;box-shadow:var(--shadow);
    border:var(--glass-border);
    backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%)}
  /* ===== 网格 ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .folder,.link{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    border:var(--glass-border);
    backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
    padding:20px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .25s cubic-bezier(.2,.8,.3,1.2), box-shadow .25s, background .25s;
    animation:pop .45s backwards;
  }
  .folder:hover,.link:hover{
    transform:translateY(-5px);background:rgba(255,255,255,.72);
    box-shadow:0 16px 40px rgba(31,38,135,.16);
  }
  /* ===== 文件夹展开 ===== */
  .folder.open{transform:translateY(-2px);background:rgba(255,255,255,.70);box-shadow:0 18px 44px rgba(31,38,135,.17)}
  .folder .head{display:flex;align-items:center;gap:14px}
  .folder .head .icon{width:48px;height:48px;border-radius:14px;font-size:22px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0}
  .folder .head h3{font-size:16px;font-weight:600}
  .folder .chev{
    margin-left:auto;font-size:13px;color:var(--muted);
    transition:transform .35s cubic-bezier(.2,.8,.3,1.2);flex-shrink:0;
  }
  .folder.open .chev{transform:rotate(180deg);color:var(--accent)}
  .folder .body{
    max-height:0;overflow:hidden;
    transition:max-height .45s cubic-bezier(.3,.7,.3,1);
  }
  .folder.open .body{overflow-y:auto}
  .folder .inner{
    padding-top:14px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
    gap:4px 14px;
  }
  .folder .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(140,150,190,.25),transparent);margin-bottom:6px}
  .sub{
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);
    padding:8px 10px;border-radius:12px;
    opacity:0;transform:translateX(-10px);
    transition:background .2s, color .2s, opacity .35s ease, transform .35s ease;
  }
  .folder.open .sub{opacity:1;transform:none;animation:fadeSlide .35s backwards}
  @keyframes fadeSlide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  .sub:hover{background:rgba(255,255,255,.65)}
  .sub .dot{
    width:28px;height:28px;border-radius:9px;color:#fff;font-weight:700;font-size:12.5px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .sub .name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub .go{margin-left:auto;font-size:12px;color:var(--muted);opacity:0;transform:translateX(-4px);transition:all .2s}
  .sub:hover .go{opacity:1;transform:none;color:var(--accent)}
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  /* ===== 便签 ===== */
  .note-wrap{width:100%;max-width:1080px;padding:10px 24px 0}
  .note{
    background:linear-gradient(180deg,rgba(255,249,214,.78),rgba(255,240,180,.62));
    border-radius:var(--radius);
    border:var(--glass-border);
    backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
    box-shadow:0 8px 32px rgba(120,100,20,.13);
    padding:22px 24px 16px;position:relative;
    transition:transform .25s, box-shadow .25s, background .25s;
  }
  .note:hover{transform:translateY(-3px);background:linear-gradient(180deg,rgba(255,250,222,.88),rgba(255,243,190,.72));box-shadow:0 16px 40px rgba(120,100,20,.18)}
  .note::before{ /* 顶部胶带装饰 */
    content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);
    width:90px;height:22px;background:rgba(255,255,255,.45);
    border-left:1px dashed rgba(0,0,0,.06);border-right:1px dashed rgba(0,0,0,.06);
    border-radius:3px;
  }
  .note-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .note-head .pin{font-size:17px}
  .note-head h3{font-size:15px;font-weight:700;color:#8a6d1a}
  .note-head .tip{font-size:11.5px;color:#b09540;margin-left:auto}
  .note-head .clear{
    border:none;cursor:pointer;background:rgba(255,255,255,.6);color:#8a6d1a;
    font-size:12px;padding:4px 12px;border-radius:99px;transition:background .2s;
  }
  .note-head .clear:hover{background:rgba(255,255,255,.95)}
  .note-edit{
    height:170px;overflow-y:auto;resize:none;
    font-size:14px;line-height:1.7;color:#5c4a12;
    outline:none;caret-color:#c9a227;word-break:break-word;
  }
  .note-edit:empty::before{content:"在这里随手记点文字，直接 Ctrl+V 粘贴图片也行 ✎";color:#c2ab63}
  .note-edit img{max-width:100%;max-height:220px;border-radius:10px;margin:6px 4px;
    box-shadow:0 4px 12px rgba(120,100,20,.2);display:inline-block;vertical-align:top}
  .note-edit:focus{background:rgba(255,255,255,.35);border-radius:10px}
  /* ===== 圆润滚动条 ===== */
  .note-edit::-webkit-scrollbar,
  .folder .body::-webkit-scrollbar{width:8px}
  .note-edit::-webkit-scrollbar-track,
  .folder .body::-webkit-scrollbar-track{background:transparent;border-radius:99px}
  .note-edit::-webkit-scrollbar-thumb{
    background:rgba(180,150,50,.35);border-radius:99px;
  }
  .note-edit::-webkit-scrollbar-thumb:hover{background:rgba(180,150,50,.55)}
  .folder .body::-webkit-scrollbar-thumb{background:rgba(79,124,255,.30);border-radius:99px}
  .folder .body::-webkit-scrollbar-thumb:hover{background:rgba(79,124,255,.5)}
  footer{color:var(--muted);font-size:12px;padding:0 0 28px}

  /* ===== 整体布局：左手机 + 右内容 ===== */
  body{
    display:flex;flex-direction:row;justify-content:center;align-items:flex-start;
    gap:38px;flex-wrap:wrap;padding:34px 22px 44px;
  }
  .wrap{
    display:flex;flex-direction:column;align-items:center;
    flex:0 1 1080px;min-width:0;
  }
  @media (max-width:1160px){
    body{flex-direction:column;align-items:center;gap:26px}
    .phone-wrap{position:static !important}
  }

  /* ===== 手机 UI（圆润 iOS 风格） ===== */
  .phone-wrap{position:sticky;top:56px;flex-shrink:0;animation:pop .5s backwards;margin-top:14px}
  .phone{
    width:344px;border-radius:52px;padding:13px;
    background:linear-gradient(160deg,#4a4e5e,#191b22 60%);
    box-shadow:0 32px 64px rgba(25,20,60,.38), inset 0 0 0 2px rgba(255,255,255,.10), inset 0 0 0 5px rgba(0,0,0,.35);
  }
  .screen{
    position:relative;border-radius:41px;overflow:hidden;
    min-height:648px;padding:12px 14px 14px;
    display:flex;flex-direction:column;gap:11px;
    background:linear-gradient(150deg,#eef2fb 0%,#f4eef8 48%,#fdf2f4 100%);
  }
  .mini-blob{
    position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;
    animation:drift 9s ease-in-out infinite alternate;pointer-events:none;
  }
  .mb1{width:170px;height:170px;background:#7aa5ff;top:-50px;left:-60px}
  .mb2{width:180px;height:180px;background:#ff9ac4;bottom:60px;right:-70px;animation-delay:-4s}
  .mb3{width:150px;height:150px;background:#ffd29a;bottom:-40px;left:-40px;animation-delay:-7s}
  .island{
    width:96px;height:27px;background:#0d0e12;border-radius:99px;
    margin:4px auto 8px;position:relative;z-index:2;
  }
  .status{
    position:relative;z-index:2;display:flex;justify-content:space-between;
    font-size:12.5px;font-weight:800;color:#23262e;padding:0 10px;margin-top:-30px;height:28px;align-items:center;
  }
  .status .sicons{letter-spacing:2px;font-size:11px}
  .p-card{
    position:relative;z-index:2;
    background:var(--card);border:var(--glass-border);border-radius:20px;
    backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
    box-shadow:0 6px 18px rgba(31,38,135,.10);
    padding:14px 16px;
  }
  .p-clock{display:flex;align-items:center;justify-content:space-between}
  .p-clock .pt{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
  .p-clock .pd{font-size:11.5px;color:var(--muted);margin-top:3px}
  .p-clock .pav{width:50px;height:50px;border-radius:16px;object-fit:cover;border:2px solid #fff;box-shadow:0 4px 12px rgba(35,45,80,.2)}
  .p-sec{position:relative;z-index:2;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1.5px;margin:5px 2px 0}
  .p-folders{position:relative;z-index:2;display:flex;flex-direction:column;gap:8px}
  .p-row{
    display:flex;align-items:center;gap:11px;cursor:pointer;
    background:var(--card);border:1px solid var(--glass-border);border-radius:18px;
    backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
    padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--text);
    transition:transform .2s, background .2s;animation:pop .4s backwards;
  }
  .p-row:hover{transform:translateX(4px);background:rgba(255,255,255,.75)}
  .p-row .pe{width:33px;height:33px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.5);flex-shrink:0}
  .p-row .pc{margin-left:auto;font-size:11px;color:var(--muted)}
  .dock{
    position:relative;z-index:2;margin-top:auto;
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    background:rgba(255,255,255,.38);border:1px solid var(--glass-border);
    border-radius:26px;padding:10px;
    backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  }
  .dock .dapp{
    aspect-ratio:1;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:23px;color:#fff;cursor:pointer;
    transition:transform .2s;box-shadow:0 5px 12px rgba(31,38,135,.18);
  }
  .dock .dapp:hover{transform:translateY(-3px) scale(1.06)}

  @media (max-width:560px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    header{padding-top:28px}
    .hello h1{font-size:21px}
  }
</style>
</head>
<body>
<div class="bg">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
  <span class="blob b5"></span>
</div>
<div class="phone-wrap">
  <div class="phone">
    <div class="screen">
      <span class="mini-blob mb1"></span>
      <span class="mini-blob mb2"></span>
      <span class="mini-blob mb3"></span>
      <div class="island"></div>
      <div class="status">
        <span id="pTime">--:--</span>
        <span class="sicons">📶 🛜 🔋</span>
      </div>
      <div class="p-card p-clock">
        <div>
          <div class="pt" id="pClock">--:--</div>
          <div class="pd" id="pDate">--</div>
        </div>
        <img class="pav" src="avatar.jpg" alt="头像">
      </div>
      <div class="p-sec">文件夹</div>
      <div class="p-folders" id="phoneFolders"></div>
      <div class="dock">
        <span class="dapp" style="background:linear-gradient(135deg,#e056a7,#ff8fb8)" title="素材">🎨</span>
        <span class="dapp" style="background:linear-gradient(135deg,#ff5c7a,#ff9aa8)" title="影视">🎬</span>
        <span class="dapp" style="background:linear-gradient(135deg,#f4a63b,#ffd166)" title="工具">🧰</span>
        <span class="dapp" style="background:linear-gradient(135deg,#6a7bff,#9aa8ff)" title="博客">✍️</span>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
<header>
  <div class="hello">
    <h1><img class="avatar" src="avatar.jpg" alt="头像">赵小雷的工作台</h1>
    <p id="greet">你好，今天也要加油呀</p>
  </div>
  <div class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">--</div>
  </div>
</header>
<div class="note-wrap">
  <div class="note">
    <div class="note-head">
      <span class="pin">📌</span>
      <h3>随手记</h3>
      <span class="tip">临时便签 · 刷新页面后清空</span>
      <button class="clear" id="noteClear">清空</button>
    </div>
    <div class="note-edit" id="noteEdit" contenteditable="true"></div>
  </div>
</div>
<div class="stage">
  <div class="view" id="view"></div>
</div>
</div>

/* ================= 工具函数 ================= */
const view = document.getElementById('view');
function hostOf(u){
  try{ return new URL(u).hostname; }catch(e){ return u.replace(/^https?:\/\//,'').split('/')[0]; }
}
function initial(t){ return t.trim().charAt(0).toUpperCase() || "•"; }
/* ================= 渲染：文件夹手风琴 ================= */
function renderHome(){
  const html = `<div class="grid">` + DATA.map((f,i)=>{
    return `
    <div class="folder" style="animation-delay:${i*45}ms" data-folder="${i}">
      <div class="head">
        <div class="icon" style="background:${f.color}1a">${f.emoji}</div>
        <h3>${f.name}</h3>
        <span style="font-size:12px;color:var(--muted)">${f.links.length}</span>
        <span class="chev">▼</span>
      </div>
      <div class="body">
        <div class="inner">
          <div class="divider"></div>
          ${f.links.map(l=>`
            <a class="sub" href="${l.u}" target="_blank" rel="noopener" style="animation-delay:${i*30}ms">
              <span class="dot" style="background:${f.color}">${initial(l.t)}</span>
              <span class="name">${l.t}</span>
              <span class="go">打开 ↗</span>
            </a>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('') + `</div>`;
  view.innerHTML = html;
  view.querySelectorAll('[data-folder]').forEach(el=>{
    const body = el.querySelector('.body');
    // 整个文件夹卡片任意位置点击都可展开/收起；点击里面的网址链接则直接打开，不触发展开
    el.addEventListener('click', (e)=>{
      if(e.target.closest('a.sub')) return;
      const isOpen = el.classList.contains('open');
      // 手风琴：先收起其他已展开的文件夹
      view.querySelectorAll('.folder.open').forEach(o=>{
        if(o !== el){ o.classList.remove('open'); o.querySelector('.body').style.maxHeight = '0px'; }
      });
      if(isOpen){
        el.classList.remove('open');
        body.style.maxHeight = '0px';
      }else{
        el.classList.add('open');
        // 展开后只露出 4 行链接，其余在文件夹内部滚动查看
        body.style.maxHeight = Math.min(body.scrollHeight, 210) + 'px';
      }
    });
  });
}
/* ================= 视图切换动画 ================= */
function swap(html){
  view.classList.add('leaving');
  setTimeout(()=>{
    view.innerHTML = html;
    view.classList.remove('leaving');
    view.classList.add('entering');
    requestAnimationFrame(()=>requestAnimationFrame(()=>view.classList.remove('entering')));
  }, 300);
}
/* ================= 时钟 & 问候 ================= */
function tick(){
  const n = new Date();
  const p = v=>String(v).padStart(2,'0');
  const hm = p(n.getHours())+":"+p(n.getMinutes());
  document.getElementById('time').textContent = hm;
  const wd = ["日","一","二","三","四","五","六"][n.getDay()];
  const dateStr = `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${wd}`;
  document.getElementById('date').textContent = dateStr;
  const h = n.getHours();
  document.getElementById('greet').textContent =
    h<6?"夜深了，注意休息 🌙":h<12?"早上好，新的一天元气满满 ☀️":
    h<14?"中午好，记得吃午饭 🍚":h<18?"下午好，继续加油 💪":"晚上好，辛苦啦";
  // 手机屏幕同步
  const pT = document.getElementById('pTime');
  if(pT){ pT.textContent = hm; document.getElementById('pClock').textContent = hm; document.getElementById('pDate').textContent = dateStr; }
}
tick(); setInterval(tick, 20000);
/* ================= 便签 ================= */
const noteEdit = document.getElementById('noteEdit');
// 支持直接粘贴图片（截图/复制图片后 Ctrl+V）
noteEdit.addEventListener('paste', (e)=>{
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  let hasImage = false;
  for(const item of items){
    if(item.type.startsWith('image/')){
      hasImage = true;
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = ()=>{
        document.execCommand('insertHTML', false,
          `<img src="${reader.result}" alt="便签图片">`);
      };
      reader.readAsDataURL(blob);
    }
  }
  if(hasImage) e.preventDefault(); // 阻止默认粘贴，只插入图片
});
// 拖拽图片进便签也能插入
noteEdit.addEventListener('dragover', e=>{ e.preventDefault(); });
noteEdit.addEventListener('drop', e=>{
  const file = [...(e.dataTransfer.files||[])].find(f=>f.type.startsWith('image/'));
  if(!file) return;
  e.preventDefault();
  const reader = new FileReader();
  reader.onload = ()=>{
    document.execCommand('insertHTML', false,
      `<img src="${reader.result}" alt="便签图片">`);
  };
  reader.readAsDataURL(file);
});
document.getElementById('noteClear').addEventListener('click', ()=>{
  noteEdit.innerHTML = '';
  noteEdit.focus();
});

/* ================= 手机 UI 数据联动 ================= */
function renderPhone(){
  const pf = document.getElementById('phoneFolders');
  pf.innerHTML = DATA.slice(0,5).map((f,i)=>`
    <div class="p-row" data-pi="${i}" style="animation-delay:${i*60}ms">
      <span class="pe" style="background:${f.color}2e">${f.emoji}</span>
      <span>${f.name}</span>
      <span class="pc">${f.links.length} 个</span>
    </div>`).join('');
  // 点击手机里的分类：右侧对应文件夹自动展开并滚动过去
  pf.querySelectorAll('[data-pi]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const idx = +row.dataset.pi;
      const card = view.querySelector(`[data-folder="${idx}"]`);
      if(!card) return;
      card.scrollIntoView({behavior:'smooth', block:'center'});
      if(!card.classList.contains('open')) card.click();
    });
  });
}
renderPhone();

renderHome();
