<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵小雷的工作台</title>
<style>
  :root{
    --bg:#eefaf5;
    --card:rgba(255,255,255,.44);
    --text:#1f2430;
    --muted:#7a8090;
    --accent:#4f7cff;
    --accent-soft:rgba(79,124,255,.12);
    --shadow:0 8px 32px rgba(31,38,135,.10);
    --radius:22px;
    --glass-border:1px solid rgba(255,255,255,.72);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:
      radial-gradient(820px 560px at 8% 6%, rgba(94,214,200,.52) 0%, transparent 60%),
      radial-gradient(900px 600px at 92% 12%, rgba(142,201,255,.52) 0%, transparent 62%),
      radial-gradient(860px 620px at 88% 92%, rgba(255,196,143,.46) 0%, transparent 60%),
      radial-gradient(760px 540px at 12% 88%, rgba(255,159,178,.44) 0%, transparent 58%),
      linear-gradient(160deg, #eefaf5 0%, #eef3fd 50%, #fdf6ee 100%);
    min-height:100vh;color:var(--text);
    display:flex;flex-direction:column;align-items:center;
    position:relative;
  }
  /* ===== 动态光斑背景 ===== */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .blob{
    position:absolute;border-radius:50%;
    filter:blur(70px);opacity:.55;
    animation:drift 26s ease-in-out infinite alternate;
    will-change:transform;
  }
  .b1{width:520px;height:520px;background:#5ed6c8;top:-140px;left:-120px;animation-duration:6s}
  .b2{width:560px;height:560px;background:#8ec9ff;top:-100px;right:-160px;animation-duration:7.5s;animation-delay:-2s}
  .b3{width:480px;height:480px;background:#ffc48f;bottom:-160px;right:6%;animation-duration:6.5s;animation-delay:-4s}
  .b4{width:460px;height:460px;background:#ff9fb2;bottom:-140px;left:4%;animation-duration:8s;animation-delay:-6s}
  .b5{width:380px;height:380px;background:#c8b6ff;top:34%;left:38%;opacity:.4;animation-duration:9s;animation-delay:-3s}
  @keyframes drift{
    0%  {transform:translate(0,0) scale(1)}
    33% {transform:translate(150px,-110px) scale(1.16)}
    66% {transform:translate(-130px,130px) scale(.9)}
    100%{transform:translate(90px,-70px) scale(1.1)}
  }
  @media (prefers-reduced-motion: reduce){
    .blob{animation:none}
  }

  header,.note-wrap,.stage,footer{position:relative;z-index:1}
  body{overflow-x:hidden}

  /* ===== 顶部 ===== */
  header{
    width:100%;max-width:1140px;
    padding:clamp(26px,4.5vh,42px) clamp(14px,2vw,24px) clamp(12px,2vh,18px);
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .hello h1{font-size:clamp(20px,1.9vw,27px);font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:clamp(10px,1.2vw,14px)}
  .hello h1 .avatar{
    width:clamp(46px,3.9vw,60px);height:clamp(46px,3.9vw,60px);border-radius:clamp(13px,1.5vw,17px);object-fit:cover;flex-shrink:0;
    border:3px solid #fff;
    box-shadow:0 6px 18px rgba(35,45,80,.18), 0 0 0 3px rgba(79,124,255,.15);
    transition:transform .3s cubic-bezier(.2,.8,.3,1.4);
  }
  .hello h1 .avatar:hover{transform:scale(1.08) rotate(-3deg)}
  .hello p{color:var(--muted);font-size:clamp(12px,1vw,13.5px);margin-top:6px}
  .clock{text-align:right}
  .clock .time{font-size:clamp(23px,2.2vw,31px);font-weight:700;font-variant-numeric:tabular-nums}
  .clock .date{color:var(--muted);font-size:clamp(12px,1vw,13.5px);margin-top:2px}
  /* ===== 视图容器 ===== */
  .stage{width:100%;max-width:1140px;padding:clamp(14px,2vh,20px) clamp(14px,2vw,24px) clamp(40px,7vh,60px);position:relative;flex:1}
  .view{transition:opacity .35s ease, transform .35s ease}
  .view.leaving{opacity:0;transform:translateY(14px) scale(.98);pointer-events:none}
  .view.entering{opacity:0;transform:translateY(-10px) scale(.99)}
  /* ===== 面包屑 ===== */
  .crumb{
    display:flex;align-items:center;gap:10px;margin:6px 0 18px;
    opacity:0;animation:fadeDown .4s .05s forwards;
  }
  .back{
    border:var(--glass-border);cursor:pointer;background:var(--card);color:var(--text);
    width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);
    backdrop-filter:blur(32px) saturate(185%);-webkit-backdrop-filter:blur(32px) saturate(185%);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    transition:transform .2s, background .2s;
  }
  .back:hover{transform:translateX(-3px);background:rgba(255,255,255,.85)}
  .crumb .path{font-size:15px;font-weight:600}
  .crumb .count{font-size:12px;color:var(--muted);background:var(--card);
    padding:4px 12px;border-radius:99px;box-shadow:var(--shadow);
    border:var(--glass-border);
    backdrop-filter:blur(32px) saturate(185%);-webkit-backdrop-filter:blur(32px) saturate(185%)}
  /* ===== 网格 ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:clamp(14px,1.5vw,20px)}
  .folder,.link{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    border:var(--glass-border);
    backdrop-filter:blur(32px) saturate(185%);-webkit-backdrop-filter:blur(32px) saturate(185%);
    padding:20px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .25s cubic-bezier(.2,.8,.3,1.2), box-shadow .25s, background .25s;
    animation:pop .45s backwards;
  }
  .folder:hover,.link:hover{
    transform:translateY(-5px);background:rgba(255,255,255,.62);
    box-shadow:0 16px 40px rgba(31,38,135,.16);
  }
  /* ===== 文件夹展开 ===== */
  .folder.open{transform:translateY(-2px);background:rgba(255,255,255,.60);box-shadow:0 18px 44px rgba(31,38,135,.17)}
  .folder .head{display:flex;align-items:center;gap:14px}
  .folder .head .icon{width:48px;height:48px;border-radius:14px;font-size:22px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0}
  .folder .head h3{font-size:16px;font-weight:600}
  .folder .chev{
    margin-left:auto;font-size:13px;color:var(--muted);
    transition:transform .35s cubic-bezier(.2,.8,.3,1.2);flex-shrink:0;
  }
  .folder.open .chev{transform:rotate(180deg);color:var(--accent)}
  .folder .body{
    max-height:0;overflow:hidden;
    transition:max-height .45s cubic-bezier(.3,.7,.3,1);
  }
  .folder.open .body{overflow-y:auto}
  .folder .inner{
    padding-top:14px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
    gap:4px 14px;
  }
  .folder .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(140,150,190,.25),transparent);margin-bottom:6px}
  .sub{
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);
    padding:8px 10px;border-radius:12px;
    opacity:0;transform:translateX(-10px);
    transition:background .2s, color .2s, opacity .35s ease, transform .35s ease;
  }
  .folder.open .sub{opacity:1;transform:none;animation:fadeSlide .35s backwards}
  @keyframes fadeSlide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  .sub:hover{background:rgba(255,255,255,.55)}
  .sub .dot{
    width:28px;height:28px;border-radius:9px;color:#fff;font-weight:700;font-size:12.5px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .sub .name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub .go{margin-left:auto;font-size:12px;color:var(--muted);opacity:0;transform:translateX(-4px);transition:all .2s}
  .sub:hover .go{opacity:1;transform:none;color:var(--accent)}
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  /* ===== 便签 ===== */
  .note-wrap{width:100%;max-width:1140px;padding:clamp(8px,1.4vh,10px) clamp(14px,2vw,24px) 0}
  .note{
    background:linear-gradient(180deg,rgba(255,249,214,.78),rgba(255,240,180,.62));
    border-radius:var(--radius);
    border:var(--glass-border);
    backdrop-filter:blur(32px) saturate(185%);-webkit-backdrop-filter:blur(32px) saturate(185%);
    box-shadow:0 8px 32px rgba(120,100,20,.13);
    padding:22px 24px 16px;position:relative;
    transition:transform .25s, box-shadow .25s, background .25s;
  }
  .note:hover{transform:translateY(-3px);background:linear-gradient(180deg,rgba(255,250,222,.88),rgba(255,243,190,.72));box-shadow:0 16px 40px rgba(120,100,20,.18)}
  .note::before{ /* 顶部胶带装饰 */
    content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);
    width:90px;height:22px;background:rgba(255,255,255,.45);
    border-left:1px dashed rgba(0,0,0,.06);border-right:1px dashed rgba(0,0,0,.06);
    border-radius:3px;
  }
  .note-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .note-head .pin{font-size:17px}
  .note-head h3{font-size:15px;font-weight:700;color:#8a6d1a}
  .note-head .tip{font-size:11.5px;color:#b09540;margin-left:auto}
  .note-head .clear{
    border:none;cursor:pointer;background:rgba(255,255,255,.6);color:#8a6d1a;
    font-size:12px;padding:4px 12px;border-radius:99px;transition:background .2s;
  }
  .note-head .clear:hover{background:rgba(255,255,255,.95)}
  .note-edit{
    height:clamp(140px,20vh,178px);overflow-y:auto;resize:none;
    font-size:14px;line-height:1.7;color:#5c4a12;
    outline:none;caret-color:#c9a227;word-break:break-word;
  }
  .note-edit:empty::before{content:"在这里随手记点文字，直接 Ctrl+V 粘贴图片也行 ✎";color:#c2ab63}
  .note-edit img{max-width:100%;max-height:220px;border-radius:10px;margin:6px 4px;
    box-shadow:0 4px 12px rgba(120,100,20,.2);display:inline-block;vertical-align:top}
  .note-edit:focus{background:rgba(255,255,255,.35);border-radius:10px}
  /* ===== 圆润滚动条 ===== */
  .note-edit::-webkit-scrollbar,
  .folder .body::-webkit-scrollbar{width:8px}
  .note-edit::-webkit-scrollbar-track,
  .folder .body::-webkit-scrollbar-track{background:transparent;border-radius:99px}
  .note-edit::-webkit-scrollbar-thumb{
    background:rgba(180,150,50,.35);border-radius:99px;
  }
  .note-edit::-webkit-scrollbar-thumb:hover{background:rgba(180,150,50,.55)}
  .folder .body::-webkit-scrollbar-thumb{background:rgba(79,124,255,.30);border-radius:99px}
  .folder .body::-webkit-scrollbar-thumb:hover{background:rgba(79,124,255,.5)}
  footer{color:var(--muted);font-size:12px;padding:0 0 28px}

  /* ===== 整体布局：左手机 + 右内容（随窗口自适应） ===== */
  body{
    display:flex;flex-direction:row;justify-content:center;align-items:flex-start;
    gap:clamp(20px,2.6vw,44px);flex-wrap:wrap;
    padding:clamp(18px,3vh,34px) clamp(14px,2vw,26px) clamp(30px,5vh,44px);
  }
  .wrap{
    display:flex;flex-direction:column;align-items:center;
    flex:1 1 640px;min-width:0;max-width:1180px;
  }
  @media (max-width:1020px){
    body{flex-direction:column;align-items:center;gap:26px}
    .phone-wrap{position:static !important;margin-top:0;width:clamp(260px, min(80vw, 56vh), 430px)}
  }

  /* ===== 手机 UI（圆润 iOS 风格 · 容器查询等比缩放） ===== */
  .phone-wrap{
    position:sticky;top:clamp(10px,2.5vh,26px);flex-shrink:0;animation:pop .5s backwards;
    margin-top:clamp(0px,1.4vh,14px);
    width:clamp(250px, min(24vw, 40vh), 430px);
    container-type:inline-size;
  }
  .phone-wrap.no-stick{position:static !important;margin-top:0}
  .phone{
    width:100%;border-radius:14.7cqw;padding:3.7cqw;
    background:linear-gradient(160deg,#4a4e5e,#191b22 60%);
    box-shadow:0 32px 64px rgba(25,20,60,.38), inset 0 0 0 2px rgba(255,255,255,.10), inset 0 0 0 5px rgba(0,0,0,.35);
  }
  .screen{
    position:relative;border-radius:11.5cqw;overflow:hidden;
    min-height:184cqw;padding:3.4cqw 4.2cqw 4.2cqw;
    display:flex;flex-direction:column;gap:3.1cqw;
    background:linear-gradient(150deg,#eef2fb 0%,#f4eef8 48%,#fdf2f4 100%);
  }
  .mini-blob{
    position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;
    animation:drift 6.5s ease-in-out infinite alternate;pointer-events:none;
  }
  .mb1{width:44cqw;height:44cqw;background:#5ed6c8;top:-13cqw;left:-16cqw}
  .mb2{width:47cqw;height:47cqw;background:#ff9fb2;bottom:16cqw;right:-18cqw;animation-delay:-2.5s}
  .mb3{width:39cqw;height:39cqw;background:#ffc48f;bottom:-10cqw;left:-10cqw;animation-delay:-4s}
  .island{
    width:27.2cqw;height:7.6cqw;background:#0d0e12;border-radius:99px;
    margin:1cqw auto 2.1cqw;position:relative;z-index:2;
  }
  .status{
    position:relative;z-index:2;display:flex;justify-content:space-between;
    font-size:3.5cqw;font-weight:800;color:#23262e;padding:0 2.6cqw;margin-top:-8.4cqw;height:7.9cqw;align-items:center;
  }
  .status .sicons{letter-spacing:.5cqw;font-size:2.9cqw}
  .p-card{
    position:relative;z-index:2;
    background:var(--card);border:var(--glass-border);border-radius:5.2cqw;
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 6px 18px rgba(31,38,135,.10);
    padding:3.7cqw 4.2cqw;
  }
  .p-clock{display:flex;align-items:center;justify-content:space-between}
  .p-clock .pt{font-size:11.5cqw;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
  .p-clock .pd{font-size:3cqw;color:var(--muted);margin-top:.8cqw}
  .p-clock .pav{width:14.1cqw;height:14.1cqw;border-radius:4.5cqw;object-fit:cover;border:2px solid #fff;box-shadow:0 4px 12px rgba(35,45,80,.2)}
  .p-sec{position:relative;z-index:2;font-size:3.1cqw;font-weight:800;color:var(--muted);letter-spacing:.4cqw;margin:1.3cqw .5cqw 0}
  .p-apps{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
  .p-app{
    display:flex;align-items:center;gap:2.4cqw;text-decoration:none;
    background:var(--card);border:1px solid var(--glass-border);border-radius:4.2cqw;
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    padding:3.4cqw 3.2cqw;font-size:3.7cqw;font-weight:700;color:var(--text);
    transition:transform .2s, background .2s, box-shadow .2s;animation:pop .4s backwards;
    box-shadow:0 4px 12px rgba(31,38,135,.08);
  }
  .p-app:hover{transform:translateY(-3px) scale(1.03);background:rgba(255,255,255,.8);box-shadow:0 9px 20px rgba(31,38,135,.15)}
  .p-app .pe{width:9.4cqw;height:9.4cqw;border-radius:3cqw;display:flex;align-items:center;justify-content:center;font-size:4.4cqw;color:#fff;flex-shrink:0}
  .dock{
    position:relative;z-index:2;margin-top:auto;
    display:grid;grid-template-columns:repeat(4,1fr);gap:2.6cqw;
    background:rgba(255,255,255,.38);border:1px solid var(--glass-border);
    border-radius:6.8cqw;padding:2.6cqw;
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  }
  .dock .dapp{
    aspect-ratio:1;border-radius:4.2cqw;display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    font-size:6.5cqw;color:#fff;cursor:pointer;
    transition:transform .2s;box-shadow:0 5px 12px rgba(31,38,135,.18);
  }
  .dock .dapp:hover{transform:translateY(-3px) scale(1.06)}

  /* ===== 手机内置浏览器（链接直接在手机屏内打开） ===== */
  .p-browser{
    position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;
    padding:12cqw 3.4cqw 4.2cqw;
    background:linear-gradient(150deg,#eef2fb 0%,#f4eef8 48%,#fdf2f4 100%);
    transform:translateY(8%) scale(.98);opacity:0;pointer-events:none;
    transition:transform .38s cubic-bezier(.3,.7,.3,1), opacity .3s;
  }
  .p-browser.on{transform:none;opacity:1;pointer-events:auto}
  .p-bar{
    display:flex;align-items:center;gap:2cqw;flex-shrink:0;
    background:var(--card);border:1px solid var(--glass-border);border-radius:99px;
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    padding:1.8cqw 2.4cqw;margin-bottom:2.6cqw;box-shadow:0 4px 12px rgba(31,38,135,.08);
  }
  .p-bar button{
    border:none;cursor:pointer;min-width:7.4cqw;height:7.4cqw;border-radius:99px;
    padding:0 2.2cqw;background:rgba(255,255,255,.65);font-size:3.2cqw;line-height:1;flex-shrink:0;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;color:var(--text);
    transition:background .2s, transform .2s;
  }
  .p-bar button:hover{background:#fff;transform:scale(1.1)}
  .p-bar .p-url{
    flex:1;font-size:3cqw;font-weight:700;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
  }
  .p-view{
    position:relative;flex:1;border-radius:5.2cqw;overflow:hidden;
    background:#fff;border:1px solid var(--glass-border);
    box-shadow:0 6px 18px rgba(31,38,135,.10);
  }
  .p-view iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .p-hint{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
    font-size:3cqw;color:var(--muted);text-align:center;line-height:1.9;
    background:rgba(255,255,255,.94);padding:3.6cqw 5cqw;border-radius:4.2cqw;
    box-shadow:0 6px 18px rgba(31,38,135,.12);display:none;max-width:82%;
  }
  /* 手机浏览器多标签栏 */
  .p-tabs{
    display:none;gap:1.8cqw;overflow-x:auto;flex-shrink:0;
    margin-bottom:2.2cqw;scrollbar-width:none;
  }
  .p-tabs::-webkit-scrollbar{display:none}
  .p-tab{
    display:flex;align-items:center;gap:1.6cqw;flex-shrink:0;cursor:pointer;
    background:var(--card);border:1px solid var(--glass-border);border-radius:99px;
    padding:1.6cqw 2.6cqw;font-size:2.9cqw;font-weight:700;color:var(--muted);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    transition:background .2s, color .2s;animation:pop .3s backwards;
  }
  .p-tab.on{background:rgba(255,255,255,.88);color:var(--text);box-shadow:0 4px 12px rgba(31,38,135,.10)}
  .p-tab .tt{max-width:22cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-tab .tx{
    width:4.6cqw;height:4.6cqw;border-radius:50%;background:rgba(120,130,160,.18);
    display:flex;align-items:center;justify-content:center;font-size:2.6cqw;line-height:1;color:inherit;
    transition:background .2s, color .2s;
  }
  .p-tab .tx:hover{background:rgba(255,92,122,.28);color:#ff5c7a}
  /* 拒绝内嵌时的引导卡片 */
  .p-block{
    position:absolute;inset:0;z-index:3;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:2cqw;text-align:center;
    background:linear-gradient(165deg,#f5f9ff 0%,#fdf4f0 100%);padding:6cqw;
  }
  .p-block .pb-emoji{font-size:9cqw;line-height:1.2}
  .p-block .pb-t{font-size:3.9cqw;font-weight:800;color:var(--text)}
  .p-block .pb-d{font-size:2.9cqw;color:var(--muted);line-height:1.9}
  .p-block .pb-btn{
    margin-top:2cqw;border:none;cursor:pointer;
    background:linear-gradient(135deg,#4f7cff,#7aa5ff);color:#fff;
    font-size:3.4cqw;font-weight:700;padding:2.8cqw 6cqw;border-radius:99px;

          <div class="divider"></div>
          ${f.links.map(l=>`
            <a class="sub" href="${l.u}" target="_blank" rel="noopener" style="animation-delay:${i*30}ms">
              <span class="dot" style="background:${f.color}">${initial(l.t)}</span>
              <span class="name">${l.t}</span>
              <span class="go">打开 ↗</span>
            </a>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('') + `</div>`;
  view.innerHTML = html;
  view.querySelectorAll('[data-folder]').forEach(el=>{
    const body = el.querySelector('.body');
    // 整个文件夹卡片任意位置点击都可展开/收起；点击里面的网址链接则在左侧手机屏内打开
    el.addEventListener('click', (e)=>{
      const sub = e.target.closest('a.sub');
      if(sub){ e.preventDefault(); openInPhone(sub.href); return; }
      const isOpen = el.classList.contains('open');
      // 手风琴：先收起其他已展开的文件夹
      view.querySelectorAll('.folder.open').forEach(o=>{
        if(o !== el){ o.classList.remove('open'); o.querySelector('.body').style.maxHeight = '0px'; }
      });
      if(isOpen){
        el.classList.remove('open');
        body.style.maxHeight = '0px';
      }else{
        el.classList.add('open');
        // 展开高度随窗口高度自适应（约屏高 22%，最少 180px），其余在文件夹内部滚动查看
        const cap = Math.max(180, Math.round(window.innerHeight*0.22));
        body.style.maxHeight = Math.min(body.scrollHeight, cap) + 'px';
      }
    });
  });
}
/* ================= 视图切换动画 ================= */
function swap(html){
  view.classList.add('leaving');
  setTimeout(()=>{
    view.innerHTML = html;
    view.classList.remove('leaving');
    view.classList.add('entering');
    requestAnimationFrame(()=>requestAnimationFrame(()=>view.classList.remove('entering')));
  }, 300);
}
/* ================= 时钟 & 问候 ================= */
function tick(){
  const n = new Date();
  const p = v=>String(v).padStart(2,'0');
  const hm = p(n.getHours())+":"+p(n.getMinutes());
  document.getElementById('time').textContent = hm;
  const wd = ["日","一","二","三","四","五","六"][n.getDay()];
  const dateStr = `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${wd}`;
  document.getElementById('date').textContent = dateStr;
  const h = n.getHours();
  document.getElementById('greet').textContent =
    h<6?"夜深了，注意休息 🌙":h<12?"早上好，新的一天元气满满 ☀️":
    h<14?"中午好，记得吃午饭 🍚":h<18?"下午好，继续加油 💪":"晚上好，辛苦啦";
  // 手机屏幕同步
  const pT = document.getElementById('pTime');
  if(pT){ pT.textContent = hm; document.getElementById('pClock').textContent = hm; document.getElementById('pDate').textContent = dateStr; }
}
tick(); setInterval(tick, 20000);
/* ================= 便签 ================= */
const noteEdit = document.getElementById('noteEdit');
// 支持直接粘贴图片（截图/复制图片后 Ctrl+V）
noteEdit.addEventListener('paste', (e)=>{
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  let hasImage = false;
  for(const item of items){
    if(item.type.startsWith('image/')){
      hasImage = true;
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = ()=>{
        document.execCommand('insertHTML', false,
          `<img src="${reader.result}" alt="便签图片">`);
      };
      reader.readAsDataURL(blob);
    }
  }
  if(hasImage) e.preventDefault(); // 阻止默认粘贴，只插入图片
});
// 拖拽图片进便签也能插入
noteEdit.addEventListener('dragover', e=>{ e.preventDefault(); });
noteEdit.addEventListener('drop', e=>{
  const file = [...(e.dataTransfer.files||[])].find(f=>f.type.startsWith('image/'));
  if(!file) return;
  e.preventDefault();
  const reader = new FileReader();
  reader.onload = ()=>{
    document.execCommand('insertHTML', false,
      `<img src="${reader.result}" alt="便签图片">`);
  };
  reader.readAsDataURL(file);
});
document.getElementById('noteClear').addEventListener('click', ()=>{
  noteEdit.innerHTML = '';
  noteEdit.focus();
});

/* ================= 手机内置浏览器：多标签 + 缩放调节 ================= */
const pBrowser = document.getElementById('pBrowser');
const pFrame   = document.getElementById('pFrame');
const pUrl     = document.getElementById('pUrl');
const pHint    = document.getElementById('pHint');
const pView    = document.querySelector('.p-view');
const pZoom    = document.getElementById('pZoom');
const pTabsEl  = document.getElementById('pTabs');
const pBlock   = document.getElementById('pBlock');
const pBlockOpen = document.getElementById('pBlockOpen');
let pLoadTimer = null;
const ZOOMS = ['m', 0.75, 'fit']; // 手机端1:1 → 缩小75% → 桌面整页适应 循环
let zi = 0;
let tabs = [], activeTab = -1;
const FRAME_W = 1024; // 桌面适应档的虚拟宽度
// 拒绝内嵌的网站（X-Frame-Options 安全策略）：直接在手机上给出新窗口打开引导
const BLOCKED = ['douyin.com','bilibili.com','weibo.com','github.com','xigua.com','youku.com','iqiyi.com','mgtv.com','v.qq.com'];
function isBlocked(u){
  try{
    const h = new URL(u).hostname;
    return BLOCKED.some(b=>h === b || h.endsWith('.' + b));
  }catch(e){ return false; }
}
function applyFrameMode(){
  const w = pView.offsetWidth, h = pView.offsetHeight;
  let logicalW, s;
  if(zi === 0){ s = 1; logicalW = w; }             // 手机端：按屏幕真实宽度 1:1 渲染，响应式网站显示手机版页面
  else if(zi === 1){ s = 0.75; logicalW = w / s; } // 缩小75%：一屏看更多内容
  else{ logicalW = FRAME_W; s = w / FRAME_W; }     // 桌面适应：整页等比缩进手机屏
  pFrame.style.width = logicalW + 'px';
  pFrame.style.height = (h / s) + 'px';
  pFrame.style.transform = 'scale(' + s + ')';
  pFrame.style.transformOrigin = '0 0';
  pZoom.textContent = zi === 0 ? '手机' : (zi === 1 ? '75%' : '适应');
}
function loadFrame(url){
  applyFrameMode();
  if(isBlocked(url)){
    pFrame.src = 'about:blank';
    pHint.style.display = 'none';
    pBlock.style.display = 'flex';   // 手机上显示"新窗口打开"引导
    return;
  }
  pBlock.style.display = 'none';
  pHint.textContent = '加载中…';
  pHint.style.display = 'block';
  pFrame.src = url;
  clearTimeout(pLoadTimer);
  pLoadTimer = setTimeout(()=>{
    pHint.textContent = '该网站拒绝内嵌，点 ↗ 新标签打开';
  }, 4000);
}
function renderTabs(){
  pTabsEl.innerHTML = tabs.map((t,i)=>`
    <span class="p-tab ${i===activeTab?'on':''}" data-i="${i}" style="animation-delay:${i*30}ms">
      <span class="tt">${t.title}</span><span class="tx" data-x="${i}">✕</span>
    </span>`).join('');
  pTabsEl.style.display = tabs.length ? 'flex' : 'none';
}
function switchTab(i){
  activeTab = i;
  const t = tabs[i];
  pUrl.textContent = t.title;
  renderTabs();
  loadFrame(t.url);
}
function openInPhone(url){
  const host = hostOf(url);
  const exist = tabs.findIndex(t=>t.url===url);
  if(exist > -1){ switchTab(exist); return; } // 已开过的网址直接切过去
  tabs.push({url, title:host});
  activeTab = tabs.length - 1;
  zi = 0;
  pUrl.textContent = host;
  pBrowser.classList.add('on');
  renderTabs();
  loadFrame(url);
}
pFrame.addEventListener('load', ()=>{
  if(pFrame.src === 'about:blank') return;
  clearTimeout(pLoadTimer);
  setTimeout(()=>{ pHint.style.display = 'none'; }, 400);
});
pTabsEl.addEventListener('click', e=>{
  const x = e.target.closest('.tx');
  if(x){ closeTab(+x.dataset.x); return; }
  const t = e.target.closest('.p-tab');
  if(t && +t.dataset.i !== activeTab) switchTab(+t.dataset.i);
});
function closeTab(i){
  tabs.splice(i,1);
  clearTimeout(pLoadTimer);
  if(!tabs.length){ goHome(); return; }
  if(i < activeTab) activeTab--;
  else if(i === activeTab) activeTab = Math.min(i, tabs.length-1);
  switchTab(activeTab);
}
function goHome(){
  clearTimeout(pLoadTimer);
  tabs = []; activeTab = -1;
  renderTabs();
  pBrowser.classList.remove('on');
  setTimeout(()=>{ pFrame.src = 'about:blank'; }, 300);
}
pZoom.addEventListener('click', ()=>{ zi = (zi+1) % ZOOMS.length; applyFrameMode(); });
window.addEventListener('resize', applyFrameMode);
document.getElementById('pHome').addEventListener('click', goHome);
document.getElementById('pExt').addEventListener('click', ()=>{
  if(pFrame.src && pFrame.src !== 'about:blank') window.open(pFrame.src, '_blank', 'noopener');
});
// 引导卡片上的"新窗口打开"按钮
pBlockOpen.addEventListener('click', ()=>{
  const t = tabs[activeTab];
  if(t) window.open(t.url, '_blank', 'noopener');
});
/* 手机比窗口还高时不吸附，保证整台手机完整可见 */
const phoneWrap = document.querySelector('.phone-wrap');
function fitPhone(){
  phoneWrap.classList.toggle('no-stick', phoneWrap.offsetHeight > window.innerHeight - 50);
}
window.addEventListener('resize', fitPhone);
setTimeout(fitPhone, 600);
// 手机磁贴 & Dock 按钮点击 → 手机屏内打开；data-ext 标记的网站拒绝内嵌，直接新标签打开
document.getElementById('phoneApps').addEventListener('click', e=>{
  const a = e.target.closest('a.p-app'); if(!a) return;
  e.preventDefault(); openInPhone(a.href);
});
document.querySelector('.dock').addEventListener('click', e=>{
  const a = e.target.closest('a.dapp'); if(!a) return;
  e.preventDefault();
  if(a.dataset.ext){ window.open(a.href, '_blank', 'noopener'); return; }
  openInPhone(a.href);
});

/* ================= 手机内音乐播放器（赵雷歌曲 · 网易云外链播放） ================= */
const TRACKS = [
  {name:"成都",        ar:"《无法长大》",   e:"🌆", c:"#6a7bff", id:"436514312"},
  {name:"鼓楼",        ar:"《无法长大》",   e:"🏯", c:"#5b6ee1", id:"447926067"},
  {name:"南方姑娘",    ar:"《赵小雷》",     e:"🌸", c:"#ff9fb2", id:"202373"},
  {name:"画",          ar:"《赵小雷》",     e:"🎨", c:"#e056a7", id:"202369"},
  {name:"理想",        ar:"《吉姆餐厅》",   e:"🌱", c:"#3ba7f4", id:"29567189"},
  {name:"少年锦时",    ar:"《吉姆餐厅》",   e:"🚂", c:"#f4a63b", id:"29567192"},
  {name:"三十岁的女人", ar:"《吉姆餐厅》",   e:"🌙", c:"#8e6cff", id:"29567191"},
  {name:"我们的时光",  ar:"《吉姆餐厅》",   e:"☀️", c:"#ff9f43", id:"29567193"},
  {name:"阿刁",        ar:"《无法长大》",   e:"🦅", c:"#4facfe", id:"447925059"},
  {name:"我记得",      ar:"《署前街少年》", e:"🍂", c:"#ff5c7a", id:"1974443814"},
];
const mOut  = id => "https://music.163.com/song/media/outer/url?id=" + id + ".mp3"; // 音频外链
const mPage = id => "https://music.163.com/#/song?id=" + id;                        // 网易云歌曲页
let mIdx = 0, mPlaying = false, mErrShown = false;
const pMusic    = document.getElementById('pMusic');
const pmAudio   = document.getElementById('pmAudio');
const pmBlockEl = document.getElementById('pmBlock');
const pmName    = document.getElementById('pmName');
const pmArtist  = document.getElementById('pmArtist');
const pmCur     = document.getElementById('pmCur');
const pmDur     = document.getElementById('pmDur');
const pmFill    = document.getElementById('pmFill');
const pmBarEl   = document.getElementById('pmBar');
const pmPlayBtn = document.getElementById('pmPlay');
const pmVol     = document.getElementById('pmVol');
const pmListEl  = document.getElementById('pmList');
const pmOpenBtn = document.getElementById('pmOpen');
pmAudio.volume = pmVol.value / 100;
function mFmt(s){
  if(!isFinite(s)) return '--:--';
  s = Math.max(0, Math.floor(s));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function pmMeta(){
  const tr = TRACKS[mIdx];
  pmName.textContent = tr.name;
  pmArtist.textContent = "赵雷 · " + tr.ar;
  pmDur.textContent = '--:--';
}
function pmRenderList(){
  pmListEl.innerHTML = TRACKS.map((t,i)=>`
    <div class="pm-item ${i===mIdx?'on':''}" data-i="${i}" style="animation-delay:${i*40}ms">
      <span class="pi-e" style="background:${t.c}">${t.e}</span>
      <span class="pi-txt"><span class="pi-n">${t.name}</span><span class="pi-a">赵雷 · ${t.ar}</span></span>
      <span class="pi-tag">${i===mIdx ? '♪ 播放中' : ''}</span>
      <a class="pi-ext" href="${mPage(t.id)}" target="_blank" rel="noopener" title="在网易云打开">↗</a>
    </div>`).join('');
}
function pmSyncUI(){
  pmPlayBtn.textContent = mPlaying ? '⏸' : '▶';
  pMusic.classList.toggle('playing', mPlaying);
  pmOpenBtn.classList.toggle('live', mPlaying);
}
function loadTrack(i, autoplay){              // 切歌：换播放源，按需起播
  mIdx = i; mErrShown = false;
  pmBlockEl.style.display = 'none';
  pmMeta(); pmRenderList();
  pmCur.textContent = '0:00'; pmFill.style.width = '0%';
  pmAudio.src = mOut(TRACKS[i].id);
  if(autoplay) pmAudio.play().catch(()=>{});
}
pmPlayBtn.addEventListener('click', ()=>{     // 播放 / 暂停
  if(!pmAudio.src){ loadTrack(mIdx, true); return; }
  if(pmAudio.paused) pmAudio.play().catch(()=>{});
  else pmAudio.pause();
});
document.getElementById('pmPrev').addEventListener('click', ()=> loadTrack((mIdx - 1 + TRACKS.length) % TRACKS.length, true));
document.getElementById('pmNext').addEventListener('click', ()=> loadTrack((mIdx + 1) % TRACKS.length, true));
pmListEl.addEventListener('click', e=>{
  if(e.target.closest('.pi-ext')) return;     // ↗ 锚点本身新窗口打开网易云，不拦截
  const it = e.target.closest('.pm-item'); if(!it) return;
  const i = +it.dataset.i;
  if(i === mIdx){ pmAudio.paused ? pmAudio.play().catch(()=>{}) : pmAudio.pause(); }
  else loadTrack(i, true);
});
pmAudio.addEventListener('playing', ()=>{ mPlaying = true;  pmSyncUI(); });
pmAudio.addEventListener('pause',   ()=>{ mPlaying = false; pmSyncUI(); });
pmAudio.addEventListener('ended',   ()=> loadTrack((mIdx + 1) % TRACKS.length, true));
pmAudio.addEventListener('loadedmetadata', ()=>{ pmDur.textContent = mFmt(pmAudio.duration); });
pmAudio.addEventListener('timeupdate', ()=>{
  const d = pmAudio.duration;
  if(isFinite(d) && d > 0){
    pmCur.textContent = mFmt(pmAudio.currentTime);
    pmFill.style.width = (pmAudio.currentTime / d * 100) + '%';
  }
});
pmAudio.addEventListener('error', ()=>{       // 外链失效（版权限制等）→ 引导去网易云官网
  if(mErrShown || !pmAudio.src) return;
  mErrShown = true; mPlaying = false; pmSyncUI();
  pmBlockEl.style.display = 'flex';
});
document.getElementById('pmBlockOpen').addEventListener('click', ()=>{
  window.open(mPage(TRACKS[mIdx].id), '_blank', 'noopener');
});
pmBarEl.addEventListener('click', e=>{        // 点进度条跳转
  const d = pmAudio.duration;
  if(!isFinite(d) || d <= 0) return;
  const r = pmBarEl.getBoundingClientRect();
  const ratio = Math.min(.995, Math.max(0, (e.clientX - r.left) / r.width));
  pmAudio.currentTime = ratio * d;
});
pmVol.addEventListener('input', ()=>{ pmAudio.volume = pmVol.value / 100; });
pmOpenBtn.addEventListener('click', ()=> pMusic.classList.add('on'));
document.getElementById('pmBack').addEventListener('click', ()=> pMusic.classList.remove('on'));
pmMeta(); pmRenderList(); pmSyncUI();

renderHome();
</script>
