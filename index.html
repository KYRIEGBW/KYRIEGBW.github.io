<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵小雷的工作台</title>
<style>
  :root{
    --text:#eaf0ff;
    --muted:rgba(234,240,255,.56);
    --glass:rgba(255,255,255,.075);
    --stroke:1px solid rgba(255,255,255,.14);
    --shadow:0 14px 36px rgba(3,7,28,.42);
    --blur:blur(22px) saturate(165%);
    --radius:20px;
    --accent:#7c9cff;
    --grad:linear-gradient(135deg,#7c9cff,#b57bff);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 720px at 10% 6%,  rgba(56,189,248,.32) 0%, transparent 60%),
      radial-gradient(1000px 700px at 90% 10%, rgba(139,92,246,.36) 0%, transparent 62%),
      radial-gradient(920px 680px at 84% 90%,  rgba(236,72,153,.26) 0%, transparent 60%),
      radial-gradient(880px 640px at 8% 92%,   rgba(16,185,129,.24) 0%, transparent 58%),
      linear-gradient(165deg,#0a0f22 0%,#131a3d 46%,#0b1424 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    padding:clamp(18px,3vh,32px) clamp(12px,1.8vw,26px) 40px;
  }
  /* ===== 极光光斑背景 ===== */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(78px);opacity:.42;animation:drift 26s ease-in-out infinite alternate;will-change:transform}
  .b1{width:560px;height:560px;background:#38bdf8;top:-150px;left:-120px;animation-duration:7s}
  .b2{width:600px;height:600px;background:#8b5cf6;top:-120px;right:-160px;animation-duration:8.5s;animation-delay:-2s}
  .b3{width:520px;height:520px;background:#ec4899;bottom:-180px;right:8%;animation-duration:7.5s;animation-delay:-4s}
  .b4{width:500px;height:500px;background:#10b981;bottom:-160px;left:2%;animation-duration:9s;animation-delay:-6s}
  .b5{width:420px;height:420px;background:#f59e0b;top:36%;left:38%;opacity:.22;animation-duration:10s;animation-delay:-3s}
  @keyframes drift{
    0%  {transform:translate(0,0) scale(1)}
    33% {transform:translate(160px,-120px) scale(1.16)}
    66% {transform:translate(-140px,140px) scale(.9)}
    100%{transform:translate(100px,-80px) scale(1.08)}
  }
  @media (prefers-reduced-motion: reduce){.blob{animation:none}}

  /* ===== 玻璃拟态基类 ===== */
  .glass{
    background:var(--glass);border:var(--stroke);border-radius:var(--radius);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.13);
  }
  ::selection{background:rgba(124,156,255,.4)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}

  /* ===== 骨架：顶部通栏 + 「左手机 ‖ 右内容」 ===== */
  .shell{
    position:relative;z-index:1;
    width:min(1340px,100%);margin:0 auto;
    display:grid;grid-template-columns:clamp(240px,21.5vw,344px) minmax(0,1fr);
    column-gap:clamp(18px,2.2vw,30px);row-gap:clamp(14px,1.9vh,22px);
    align-items:start;
  }
  .shell > .hero{grid-column:1 / -1}
  .phone-col{position:sticky;top:clamp(10px,2.5vh,24px);align-self:start;min-width:0}
  .phone-col.no-stick{position:static}
  .main{display:flex;flex-direction:column;gap:clamp(14px,1.8vh,20px);min-width:0}
  @media (max-width:1060px){
    .shell{grid-template-columns:1fr;row-gap:20px}
    .phone-col{position:static;justify-self:center;width:clamp(240px,62vw,330px)}
    .phone-wrap{width:min(100%,46vh) !important;margin-inline:auto}
  }

  /* ===== 顶部信息条 ===== */
  .hero{
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    padding:clamp(14px,1.8vh,20px) clamp(18px,2vw,26px);animation:rise .6s backwards;
  }
  .hero-l{display:flex;align-items:center;gap:14px;min-width:0}
  .hero-l .avatar{
    width:clamp(46px,3.6vw,58px);height:clamp(46px,3.6vw,58px);border-radius:16px;object-fit:cover;flex-shrink:0;
    border:2px solid rgba(255,255,255,.5);
    box-shadow:0 8px 22px rgba(3,7,28,.5), 0 0 0 4px rgba(124,156,255,.18);
    transition:transform .3s cubic-bezier(.2,.8,.3,1.4);
  }
  .hero-l .avatar:hover{transform:scale(1.08) rotate(-3deg)}
  .hero-l h1{font-size:clamp(19px,1.75vw,25px);font-weight:700;letter-spacing:.6px}
  .hero-l p{color:var(--muted);font-size:clamp(12px,.95vw,13.5px);margin-top:5px}
  .hero-r{text-align:right}
  /* ===== 顶部「空气」小组件：会飘、会被戳破的泡泡 ===== */
  .air-widget{
    position:relative;flex:1 1 150px;min-width:0;
    height:clamp(42px,5vh,56px);border-radius:999px;overflow:hidden;
    cursor:crosshair;-webkit-user-select:none;user-select:none;
    background:linear-gradient(120deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.11);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15), inset 0 -10px 20px rgba(3,7,28,.30);
  }
  .air-widget canvas{display:block;width:100%;height:100%}
  @media (max-width:880px){.air-widget{display:none}}
  .hero-r .time{font-size:clamp(24px,2.1vw,32px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .hero-r .date{color:var(--muted);font-size:clamp(11.5px,.92vw,13px);margin-top:3px}

  /* ===== 卡片通用 ===== */
  .cols{display:flex;flex-wrap:wrap;gap:clamp(14px,1.6vw,20px);align-items:stretch}
  .cols > .card{flex:1 1 330px;min-width:0}
  .cols > .card.sized{align-self:flex-start}
  @media (max-width:820px){
    .cols{flex-direction:column}
    .cols > .card{flex:1 1 auto}
  }
  .card{padding:clamp(16px,1.7vw,22px);display:flex;flex-direction:column;min-width:0}
  /* 可调节大小的卡片 */
  .resizable{position:relative;container-type:inline-size}
  .card.sized:not(.note){overflow:hidden}
  @container (max-width: 388px){ .resizable .card-head .badge{display:none} }
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-shrink:0;flex-wrap:wrap;row-gap:8px}
  .card-head .ic{
    width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:16px;background:var(--grad);flex-shrink:0;box-shadow:0 4px 12px rgba(124,156,255,.35);
  }
  .card-head h3{font-size:15.5px;font-weight:700;letter-spacing:.4px;white-space:nowrap;flex-shrink:0}
  .card-head .badge{
    margin-left:auto;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.07);
    border:var(--stroke);padding:3px 11px;border-radius:99px;white-space:nowrap;
    min-width:0;overflow:hidden;text-overflow:ellipsis;
  }
  .card-head .mini-btn{
    border:var(--stroke);cursor:pointer;background:rgba(255,255,255,.06);color:var(--muted);
    font-size:11.5px;padding:4px 11px;border-radius:99px;transition:.2s;margin-left:8px;
    white-space:nowrap;flex-shrink:0;
  }
  .card-head .mini-btn:hover{background:rgba(255,255,255,.16);color:var(--text)}
  .card-head .mini-btn.on{background:rgba(124,156,255,.26);color:var(--text);border-color:rgba(124,156,255,.5)}

  /* ===== 今日待办 ===== */
  .todo-add{display:flex;gap:9px;margin-bottom:12px;flex-shrink:0}
  .todo-add input{
    flex:1;min-width:0;background:rgba(255,255,255,.06);border:var(--stroke);
    border-radius:13px;padding:10px 14px;color:var(--text);font-size:13.5px;outline:none;
    transition:.2s;font-family:inherit;
  }
  .todo-add input::placeholder{color:rgba(234,240,255,.34)}
  .todo-add input:focus{background:rgba(255,255,255,.12);border-color:rgba(124,156,255,.55);box-shadow:0 0 0 3px rgba(124,156,255,.14)}
  .todo-add button{
    width:42px;border:none;cursor:pointer;border-radius:13px;font-size:19px;color:#fff;
    background:var(--grad);box-shadow:0 6px 16px rgba(124,156,255,.34);transition:.2s;flex-shrink:0;line-height:1;
  }
  .todo-add button:hover{transform:translateY(-2px) scale(1.04)}
  .todo-list{list-style:none;display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:min(38vh,340px);flex:1 1 auto;min-height:70px;padding-right:2px}
  .card.sized .todo-list{max-height:none;min-height:0}
  .todo-list li{
    display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:14px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    transition:.2s;animation:rise .35s backwards;
  }
  .todo-list li:hover{background:rgba(255,255,255,.1);transform:translateX(2px)}
  .todo-list li .ck{
    width:20px;height:20px;border-radius:7px;flex-shrink:0;cursor:pointer;
    border:1.6px solid rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:transparent;transition:.22s;background:rgba(255,255,255,.04);
  }
  .todo-list li .ck:hover{border-color:var(--accent);background:rgba(124,156,255,.18)}
  .todo-list li.done .ck{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(124,156,255,.4)}
  .todo-list li .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.5;word-break:break-word;transition:.22s}
  .todo-list li.done .tx{color:var(--muted);text-decoration:line-through;opacity:.6}
  .todo-list li .del{
    border:none;background:transparent;cursor:pointer;color:rgba(234,240,255,.3);
    font-size:13px;opacity:0;transition:.2s;flex-shrink:0;padding:2px 4px;
  }
  .todo-list li:hover .del{opacity:1}
  .todo-list li .del:hover{color:#ff7a9c;transform:scale(1.15)}
  .todo-empty{text-align:center;color:rgba(234,240,255,.34);font-size:13px;padding:10px 0;line-height:1.75}
  .todo-empty span{display:block;font-size:26px;margin-bottom:6px;opacity:.7}

  /* ===== 随手记（唯一可自由调节大小的卡片） ===== */
  .note{position:relative;background:linear-gradient(180deg,rgba(255,224,150,.10),rgba(255,205,110,.05));container-type:inline-size}
  .note .ic{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 4px 12px rgba(245,158,11,.35)}
  .note h3{color:#ffe6a8}
  .note::before{
    content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);
    width:88px;height:20px;background:rgba(255,255,255,.22);
    border-left:1px dashed rgba(255,255,255,.18);border-right:1px dashed rgba(255,255,255,.18);
    border-radius:3px;pointer-events:none;
  }
  /* 卡片被拉窄时优先隐藏说明文字，保证「清空」按钮永远在 */
  @container (max-width: 340px){ .note .badge{display:none} }
  .note-edit{
    flex:1;min-height:130px;overflow-y:auto;outline:none;
    font-size:14px;line-height:1.75;color:rgba(255,255,255,.9);caret-color:#fbbf24;word-break:break-word;
  }
  .note-edit:empty::before{content:"随手记点什么，Ctrl+V 可直接粘贴图片 ✎";color:rgba(255,230,168,.42)}
  .note-edit img{max-width:100%;max-height:200px;border-radius:10px;margin:6px 4px;box-shadow:0 4px 14px rgba(0,0,0,.35);display:inline-block;vertical-align:top}
  .note-edit:focus{background:rgba(255,255,255,.06);border-radius:12px}
  /* ===== 调节大小手柄（右下角） ===== */
  .rz{
    position:absolute;right:5px;bottom:5px;width:20px;height:20px;border-radius:8px;z-index:24;
    opacity:0;pointer-events:none;transition:opacity .2s;background-color:rgba(255,255,255,.18);cursor:nwse-resize;
    background-image:
      linear-gradient(135deg, transparent 44%, rgba(255,255,255,.9) 44%, rgba(255,255,255,.9) 56%, transparent 56%),
      linear-gradient(135deg, transparent 68%, rgba(255,255,255,.9) 68%, rgba(255,255,255,.9) 80%, transparent 80%);
  }
  .resizable:hover > .rz,.rz:hover,body.resizing .rz{opacity:.9;pointer-events:auto}
  body.resizing{cursor:nwse-resize;user-select:none}
  body.resizing *{transition:none !important}

  /* ===== 站点导航 ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:clamp(12px,1.3vw,18px);align-items:start;align-content:start}
  .card.sized .grid{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:4px}

  /* ===== 底部动态波纹 ===== */
  .wave-row{
    grid-column:1 / -1;                 /* 通栏：左端 = 手机左缘，右端 = 内容右缘 */
    margin-top:clamp(22px,3.2vh,40px);   /* 波纹整体下移，与站点导航/手机底边拉开一段呼吸距离 */
    animation:cardIn .8s .5s cubic-bezier(.2,.86,.3,1.06) backwards;
  }
  .wave{
    display:block;width:100%;height:clamp(56px,8.5vh,104px);overflow:hidden;pointer-events:none;
    /* 左右两端淡出：线条没有“线头/断口”的边缘感 */
    -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.4) 3.5%,#000 9%,#000 91%,rgba(0,0,0,.4) 96.5%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.4) 3.5%,#000 9%,#000 91%,rgba(0,0,0,.4) 96.5%,transparent 100%);
  }
  .wave .wline{fill:none;stroke-linecap:round;stroke-linejoin:round}
  @keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
  .wave .wscroll{transform-box:view-box;animation:waveMove linear infinite;will-change:transform}
  @media (prefers-reduced-motion: reduce){.wave .wscroll{animation:none}}
  .folder{
    background:rgba(255,255,255,.06);border:var(--stroke);border-radius:16px;
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    padding:16px;cursor:pointer;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    transition:transform .25s cubic-bezier(.2,.8,.3,1.2), background .25s, box-shadow .25s;
    animation:rise .45s backwards;
  }
  .folder:hover{transform:translateY(-4px);background:rgba(255,255,255,.12);box-shadow:0 16px 34px rgba(3,7,28,.45)}
  .folder.open{background:rgba(255,255,255,.12);box-shadow:0 18px 40px rgba(3,7,28,.5)}
  .folder .head{display:flex;align-items:center;gap:12px}
  .folder .head .icon{width:42px;height:42px;border-radius:13px;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .folder .head h3{font-size:15px;font-weight:600}
  .folder .head .n{font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.08);border-radius:99px;padding:2px 8px}
  .folder .chev{margin-left:auto;font-size:12px;color:var(--muted);transition:transform .35s cubic-bezier(.2,.8,.3,1.2);flex-shrink:0}
  .folder.open .chev{transform:rotate(180deg);color:var(--accent)}
  .folder .body{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.3,.7,.3,1)}
  .folder.open .body{overflow-y:auto}
  .folder .inner{padding-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:3px 12px}
  .folder .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);margin-bottom:6px}
  .sub{
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);
    padding:7px 9px;border-radius:12px;opacity:0;transform:translateX(-10px);
    transition:background .2s, opacity .35s ease, transform .35s ease;
  }
  .folder.open .sub{opacity:1;transform:none;animation:fadeSlide .35s backwards}
  @keyframes fadeSlide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  .sub:hover{background:rgba(255,255,255,.12)}
  .sub .dot{width:26px;height:26px;border-radius:9px;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .sub .name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub .go{margin-left:auto;font-size:11.5px;color:var(--muted);opacity:0;transform:translateX(-4px);transition:.2s}
  .sub:hover .go{opacity:1;transform:none;color:var(--accent)}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  footer{text-align:center;color:rgba(234,240,255,.32);font-size:11.5px;padding:4px 0 2px}

  /* ================= 手机 ================= */
  .phone-wrap{
    width:100%;margin-right:auto;              /* 靠左对齐，保证底部波纹左端与手机左缘齐平；具体宽度由 JS 按右侧内容高度计算 */
    container-type:inline-size;animation:rise .6s backwards;
  }
  .phone{
    width:100%;border-radius:14.7cqw;padding:3.7cqw;
    background:linear-gradient(160deg,#4a4e5e,#191b22 60%);
    box-shadow:0 30px 60px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.10), inset 0 0 0 5px rgba(0,0,0,.35);
  }
  .screen{
    position:relative;border-radius:11.5cqw;overflow:hidden;
    height:178cqw;padding:3.4cqw 4.2cqw 2.6cqw;
    display:flex;flex-direction:column;gap:2.4cqw;color:#eaf0ff;
    background:linear-gradient(165deg,#1e2549 0%,#151a38 55%,#1a1436 100%);
  }
  .mini-blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.4;animation:drift 6.5s ease-in-out infinite alternate;pointer-events:none}
  .mb1{width:44cqw;height:44cqw;background:#38bdf8;top:-13cqw;left:-16cqw}
  .mb2{width:47cqw;height:47cqw;background:#b57bff;bottom:16cqw;right:-18cqw;animation-delay:-2.5s}
  .mb3{width:39cqw;height:39cqw;background:#f59e0b;bottom:-10cqw;left:-10cqw;animation-delay:-4s}
  .island{width:27.2cqw;height:7.6cqw;background:#0d0e12;border-radius:99px;margin:1cqw auto .6cqw;position:relative;z-index:2}
  .status{
    position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;
    font-size:3.5cqw;font-weight:800;color:#eaf0ff;padding:0 2.6cqw;margin-top:-8.4cqw;height:7.9cqw;
  }
  .status .sicons{letter-spacing:.5cqw;font-size:2.9cqw}
  /* 两页切换 */
  .p-pager{position:relative;z-index:2;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
  .p-track{display:flex;width:200%;height:100%;will-change:transform;transform:translateX(0)}
  .p-page{
    width:50%;height:100%;flex-shrink:0;display:flex;flex-direction:column;gap:3cqw;
    overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  }
  .p-page::-webkit-scrollbar{display:none}
  .p-nav{
    position:relative;z-index:2;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;gap:3.2cqw;padding:.6cqw 0 0;
  }
  .p-arrow{
    width:9.6cqw;height:9.6cqw;border-radius:50%;flex-shrink:0;padding:0;
    display:flex;align-items:center;justify-content:center;line-height:1;
    font-size:5cqw;font-weight:700;color:#eaf0ff;cursor:pointer;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    box-shadow:0 2cqw 4cqw rgba(0,0,0,.3);
    transition:transform .2s, background .2s, opacity .25s;
  }
  .p-arrow:hover{background:rgba(255,255,255,.26);transform:scale(1.1)}
  .p-arrow:active{transform:scale(.94)}
  .p-arrow.off{opacity:.3;pointer-events:none}
  .p-dots{display:flex;align-items:center;gap:1.8cqw}
  .p-dots i{width:2.2cqw;height:2.2cqw;border-radius:99px;background:rgba(255,255,255,.28);cursor:pointer;transition:width .32s cubic-bezier(.3,.7,.3,1), background .32s}
  .p-dots i.on{width:6.4cqw;background:var(--grad)}
  /* 主屏 */
  .p-card{
    position:relative;z-index:2;flex-shrink:0;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:5.2cqw;

<body>

    <!-- 站点导航 -->

<script>
/* ================= 数据（来自浏览器书签导出） ================= */
const DATA = [
  { name:"会计", emoji:"🧾", color:"#4f7cff", links:[

  ]},
  { name:"影视", emoji:"🎬", color:"#ff5c7a", links:[
    {t:"抖音",u:"http://dy.pbgia.com/bmdy"},
    {t:"腾讯视频",u:"https://v.qq.com/"},
    {t:"爱奇艺",u:"https://www.iqiyi.com/"},

    {t:"微博",u:"https://s.weibo.com/weibo?q=%E8%B5%B5%E9%9B%B7%E7%94%B5%E8%84%91%E5%A3%81%E7%BA%B8&page=5"},
    {t:"GitHub",u:"https://github.com/"},
  ]},
];

/* ================= 工具 ================= */
function initial(t){ return t.trim().charAt(0).toUpperCase() || "•"; }
const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

/* ================= 时钟 & 问候 ================= */
function tick(){
  const n = new Date();
  const p = v=>String(v).padStart(2,'0');
  const hm = p(n.getHours())+":"+p(n.getMinutes());
  document.getElementById('time').textContent = hm;
  document.getElementById('date').textContent = `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 ${WD[n.getDay()]}`;
  const h = n.getHours();
  document.getElementById('greet').textContent =
    h<6?"夜深了，注意休息 🌙":h<12?"早上好，新的一天元气满满 ☀️":
    h<14?"中午好，记得吃午饭 🍚":h<18?"下午好，继续加油 💪":"晚上好，辛苦啦";
  document.getElementById('pTime').textContent = hm;
  document.getElementById('pClock').textContent = hm;
  document.getElementById('pDate').textContent = `${n.getMonth()+1}月${n.getDate()}日 ${WD[n.getDay()]}`;
  document.getElementById('calTodayTxt').textContent = `今天 · ${n.getMonth()+1}月${n.getDate()}日`;
}
tick(); setInterval(tick, 20000);

/* ================= 站点导航（手风琴 · 网址直接新窗口打开） ================= */
function renderSites(){
  const grid = document.getElementById('siteGrid');
  grid.innerHTML = DATA.map((f,i)=>`
    <div class="folder" style="animation-delay:${380 + Math.min(i,10)*55}ms">
      <div class="head">
        <div class="icon" style="background:${f.color}26">${f.emoji}</div>
        <h3>${f.name}</h3>
        <span class="n">${f.links.length}</span>
        <span class="chev">▼</span>
      </div>
      <div class="body">
        <div class="inner">
          <div class="divider"></div>
          ${f.links.map(l=>`
            <a class="sub" href="${l.u}" target="_blank" rel="noopener">
              <span class="dot" style="background:${f.color}">${initial(l.t)}</span>
              <span class="name">${l.t}</span>
              <span class="go">打开 ↗</span>
            </a>`).join('')}
        </div>
      </div>
    </div>`).join('');
  document.getElementById('sitesBadge').textContent = DATA.length + ' 个分类 · ' + DATA.reduce((s,f)=>s+f.links.length,0) + ' 个站点';
  /* 展开后最多只露 3 个站点，其余的往下滚动 */
  const VISIBLE_ROWS = 3;
  function openCap(body){
    const full = body.scrollHeight;
    const subs = body.querySelectorAll('.sub');
    if(subs.length <= VISIBLE_ROWS) return full;                  /* 不足 3 个就不用滚 */
    const last = subs[VISIBLE_ROWS - 1];
    const h = last.offsetTop + last.offsetHeight - body.offsetTop + 6;   /* 3 行 + 一点余量，暗示下面还有 */
    return Math.round(Math.max(80, Math.min(full, h)));
  }
  grid.querySelectorAll('.folder').forEach(el=>{
    const body = el.querySelector('.body');
    el.addEventListener('click', e=>{
      if(e.target.closest('a.sub')) return;   // 网址交给浏览器：新窗口打开目标站，工作台不动
      const isOpen = el.classList.contains('open');
      grid.querySelectorAll('.folder.open').forEach(o=>{
        if(o !== el){ o.classList.remove('open'); o.querySelector('.body').style.maxHeight = '0px'; }
      });
      if(isOpen){
        el.classList.remove('open');
        body.style.maxHeight = '0px';
      }else{
        el.classList.add('open');
        body.style.maxHeight = openCap(body) + 'px';
      }
    });
  });
}
renderSites();

/* ================= 今日待办（本地保存） ================= */
const TODO_KEY = 'wt-todo-v1';
let todos = [];
try{ todos = JSON.parse(localStorage.getItem(TODO_KEY) || '[]'); }catch(e){ todos = []; }
const todoList  = document.getElementById('todoList');
const todoEmpty = document.getElementById('todoEmpty');
const todoInput = document.getElementById('todoInput');
function saveTodos(){ try{ localStorage.setItem(TODO_KEY, JSON.stringify(todos)); }catch(e){} }
const todoAllBtn = document.getElementById('todoAll');
function renderTodos(){
  todoList.innerHTML = todos.map((t,i)=>`
    <li class="${t.done?'done':''}" style="animation-delay:${Math.min(i,12)*45}ms" data-id="${t.id}">
      <span class="ck" data-act="toggle">✓</span>
      <span class="tx">${t.text.replace(/</g,'&lt;')}</span>
      <button class="del" data-act="del" title="删除">✕</button>
    </li>`).join('');
  const done = todos.filter(t=>t.done).length;
  document.getElementById('todoBadge').textContent = `${done} / ${todos.length} 已完成`;
  todoEmpty.style.display = todos.length ? 'none' : 'block';
  const allDone = todos.length > 0 && done === todos.length;
  todoAllBtn.textContent = allDone ? '取消全选' : '全选';
  todoAllBtn.classList.toggle('on', allDone);
}
todoAllBtn.addEventListener('click', ()=>{
  if(!todos.length) return;
  const allDone = todos.every(t=>t.done);
  todos.forEach(t=>{ t.done = !allDone; });
  saveTodos(); renderTodos();
});
function addTodo(){
  const v = todoInput.value.trim();
  if(!v) return;
  todos.push({ id: Date.now() + '' + Math.random().toString(36).slice(2,6), text: v, done: false });
  todoInput.value = '';
  saveTodos(); renderTodos();
  todoList.scrollTop = todoList.scrollHeight;
}
todoInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') addTodo(); });
document.getElementById('todoAdd').addEventListener('click', addTodo);
todoList.addEventListener('click', e=>{
  const li = e.target.closest('li'); if(!li) return;
  const act = e.target.dataset.act;
  const t = todos.find(x=>x.id === li.dataset.id); if(!t) return;
  if(act === 'toggle') t.done = !t.done;
  else if(act === 'del') todos = todos.filter(x=>x.id !== t.id);
  saveTodos(); renderTodos();
});
document.getElementById('todoClear').addEventListener('click', ()=>{
  todos = todos.filter(t=>!t.done); saveTodos(); renderTodos();
});
renderTodos();

/* ================= 随手记（内容自动保存到本地） ================= */
const NOTE_KEY = 'wt-note-v2';
const noteEdit = document.getElementById('noteEdit');
try{
  const saved = localStorage.getItem(NOTE_KEY);
  if(saved) noteEdit.innerHTML = saved;
}catch(e){}
let noteTimer = null;
function saveNote(){

/* ================= 卡片：八向调节大小 + 长按拖动（刷新自动还原默认布局） ================= */
/* 清掉旧版尺寸存档：刷新后一律回到初始排版 */
['wt-card-size-v1','wt-card-size-v2','wt-note-size-v1'].forEach(k=>{

});

const cardState = new Map();
function applyCard(el){
  const s = cardState.get(el); if(!s) return;
  el.style.width  = s.w ? s.w + 'px' : '';
  el.style.height = s.h ? s.h + 'px' : '';
  /* 关键：只有「横向」排列的父容器（.cols）才能同步 flex-basis。
     站点导航的父容器 .main 是纵向 flex，flex-basis 会被当成「高度」，
     一拉宽度就会把整张卡撑得非常大。 */
  const p = el.parentElement;
  const rowDir = p ? getComputedStyle(p).flexDirection.indexOf('row') === 0 : false;
  el.style.flexBasis = (s.w && rowDir) ? s.w + 'px' : '';
  el.classList.toggle('sized', !!(s.w || s.h));
}
function resetCard(el){
  const s = cardState.get(el); if(!s) return;
  s.w = null; s.h = null;
  applyCard(el);
}

function setupCard(el, minW, minH){
  if(!el) return;
  el.classList.add('resizable');
  cardState.set(el, { w:null, h:null });

  const h = document.createElement('span');
  h.className = 'rz'; h.title = '拖动调整大小 · 双击还原';
  el.appendChild(h);
  h.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation();
    try{ h.setPointerCapture(e.pointerId); }catch(_){}
    const s = cardState.get(el);
    const r = el.getBoundingClientRect();
    const w0 = r.width, h0 = r.height;
    const px = e.clientX, py = e.clientY;
    /* 上限取父容器宽度，保证拉多大就显示多大，不会溢出 */
    const maxW = Math.max(minW, (el.parentElement ? el.parentElement.clientWidth : 1400) - 2);
    document.body.classList.add('resizing');
    const move = ev=>{
      s.w = Math.round(Math.max(minW, Math.min(maxW, w0 + ev.clientX - px)));
      s.h = Math.round(Math.max(minH, h0 + ev.clientY - py));
      applyCard(el);
    };
    const up = ()=>{
      document.body.classList.remove('resizing');
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', up);
      h.removeEventListener('pointercancel', up);
    };
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });
  h.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); });
  h.addEventListener('dblclick', e=>{ e.preventDefault(); e.stopPropagation(); resetCard(el); });
}
setupCard(document.getElementById('todoCard'),  260, 200);
setupCard(document.getElementById('noteCard'),  220, 170);

/* ================= 手机：两页切换（按钮 / 滑动 / 圆点） ================= */
const pager = document.getElementById('pPager');
const track = document.getElementById('pTrack');
const dots  = [...document.querySelectorAll('#pDots i')];
const pPrevBtn = document.getElementById('pPrev');
const pNextBtn = document.getElementById('pNext');
let curPage = 0;
function setPage(i, animate){
  curPage = Math.max(0, Math.min(1, i));
  track.style.transition = (animate === false) ? 'none' : 'transform .42s cubic-bezier(.32,.72,.28,1)';
  track.style.transform = 'translateX(-' + (curPage * 50) + '%)';
  dots.forEach((d,k)=> d.classList.toggle('on', k === curPage));
  pPrevBtn.classList.toggle('off', curPage === 0);
  pNextBtn.classList.toggle('off', curPage === 1);
}
dots.forEach((d,k)=> d.addEventListener('click', ()=> setPage(k)));
pPrevBtn.addEventListener('click', ()=> setPage(curPage - 1));
pNextBtn.addEventListener('click', ()=> setPage(curPage + 1));
setPage(0, false);
let swX = null, swY = null, swBase = 0, swW = 1, swOn = false;
pager.addEventListener('pointerdown', e=>{
  if(e.target.closest('button')) return;            // 日历按钮不抢手势
  swX = e.clientX; swY = e.clientY; swW = pager.offsetWidth || 1;
  swBase = curPage * 50; swOn = false;
});
pager.addEventListener('pointermove', e=>{
  if(swX === null) return;
  const dx = e.clientX - swX, dy = e.clientY - swY;
  if(!swOn){
    if(Math.abs(dx) < 7) return;
    if(Math.abs(dx) < Math.abs(dy)){ swX = null; return; }   // 纵向滚动交给页面
    swOn = true; track.style.transition = 'none';
    try{ pager.setPointerCapture(e.pointerId); }catch(_){}
  }
  const pos = Math.max(-8, Math.min(58, swBase - (dx / swW) * 50));
  track.style.transform = 'translateX(' + (-pos) + '%)';
});
function endSwipe(e){
  if(swX === null) return;
  const dx = e.clientX - swX, moved = swOn;
  swX = null; swOn = false;
  if(!moved){ setPage(curPage); return; }
  const ratio = dx / swW;
  if(ratio < -0.10) setPage(1);
  else if(ratio > 0.10) setPage(0);
  else setPage(curPage);
}
pager.addEventListener('pointerup', endSwipe);
pager.addEventListener('pointercancel', ()=>{ swX = null; swOn = false; setPage(curPage); });

/* 手机尺寸自动跟随右侧内容：手机最下端一路拉长到「底部波纹的最高点」，中间不留空档 */
const phoneWrap = document.getElementById('phoneWrap');
const phoneCol  = document.getElementById('phoneCol');
const mainCol   = document.querySelector('.main');
/* 实测手机「总高 ÷ 宽度」的比例（3.7cqw 内边距 ×2 + 178cqw 屏幕），用固定值兜底 */
let PHONE_RATIO = 1.854;
(function(){
  const prev = phoneWrap.style.width;
  phoneWrap.style.width = '300px';
  const h = phoneWrap.offsetHeight;          /* offsetHeight 不受入场动画的 scale 影响 */
  phoneWrap.style.width = prev;
  if(h > 20) PHONE_RATIO = h / 300;
})();
function fitPhone(){
  if(!phoneWrap || !phoneCol) return;
  if(window.matchMedia('(max-width:1060px)').matches){    /* 窄屏：手机独立成行，交给 CSS */
    phoneCol.style.height = ''; phoneWrap.style.width = '';
    phoneCol.classList.remove('no-stick');
    return;
  }
  if(!mainCol) return;
  const mcH = mainCol.getBoundingClientRect().height;
  if(!(mcH > 40)) return;
  /* 先把左列高度钉成右列高度：手机再高也不会把行/波纹顶走，避免“手机变高→行变高→手机再变高”的死循环 */
  const rowH = Math.max(mcH, 360);
  phoneCol.style.height = Math.round(rowH) + 'px';
  const avail = phoneCol.getBoundingClientRect().width;      /* 左列可用宽度（上限） */
  /* 闭环反算宽度：cqw 比例与理论值有微小出入，所以直接量手机的实际高度去修正宽度，
     直到「手机总高 = 右列总高」——即手机最下端与站点导航最下端严格齐平 */
  let w = Math.max(210, Math.min(avail, rowH / PHONE_RATIO));
  phoneWrap.style.width = Math.round(w) + 'px';
  for(let i = 0; i < 3; i++){
    const h = phoneWrap.offsetHeight, cw = phoneWrap.offsetWidth;
    if(!h || !cw) break;
    const next = Math.max(210, Math.min(avail, rowH * cw / h));
    if(Math.abs(next - cw) < 0.5) break;
    phoneWrap.style.width = Math.round(next) + 'px';
  }
  /* 手机比窗口还高时不吸附，保证整台手机完整可见 */
  phoneCol.classList.toggle('no-stick', phoneWrap.offsetHeight > window.innerHeight - 50);
}
window.addEventListener('resize', fitPhone);
window.addEventListener('load', fitPhone);
fitPhone();
setTimeout(fitPhone, 400);
setTimeout(fitPhone, 1000);   /* 字体/图片加载完后再校一次，避免首屏量到旧高度 */

/* ================= 手机第二页：日历 ================= */
const calGrid = document.getElementById('calGrid');
const now = new Date();
let calY = now.getFullYear(), calM = now.getMonth();
let selY = now.getFullYear(), selM = now.getMonth(), selD = now.getDate();
function renderCal(){
  document.getElementById('calTitle').textContent = calY + '年' + (calM + 1) + '月';
  const startDow = (new Date(calY, calM, 1).getDay() + 6) % 7;   // 周一为一周起点
  const days = new Date(calY, calM + 1, 0).getDate();
  const prevDays = new Date(calY, calM, 0).getDate();
  let cells = '';
  for(let i = 0; i < 42; i++){
    let y = calY, m = calM, d, dim = false;
    if(i < startDow){ m = calM - 1; d = prevDays - startDow + 1 + i; dim = true; }
    else if(i >= startDow + days){ m = calM + 1; d = i - startDow - days + 1; dim = true; }
    else d = i - startDow + 1;
    if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
    const cls = ['cal-d'];
    if(dim) cls.push('dim');
    if(!dim && y === now.getFullYear() && m === now.getMonth() && d === now.getDate()) cls.push('today');
    if(y === selY && m === selM && d === selD) cls.push('sel');
    cells += '<div class="' + cls.join(' ') + '" data-y="' + y + '" data-m="' + m + '" data-d="' + d + '">' + d + '</div>';
  }
  calGrid.innerHTML = cells;
  document.getElementById('calSelTxt').textContent =
    '已选 ' + (selM + 1) + '月' + selD + '日 ' + WD[new Date(selY, selM, selD).getDay()].replace('星期','周');
}
calGrid.addEventListener('click', e=>{
  const c = e.target.closest('.cal-d'); if(!c) return;
  selY = +c.dataset.y; selM = +c.dataset.m; selD = +c.dataset.d;
  if(selM < 0){ selM = 11; selY--; } if(selM > 11){ selM = 0; selY++; }
  calY = selY; calM = selM;
  renderCal();
});
document.getElementById('calPrev').addEventListener('click', ()=>{ calM--; if(calM < 0){ calM = 11; calY--; } renderCal(); });
document.getElementById('calNext').addEventListener('click', ()=>{ calM++; if(calM > 11){ calM = 0; calY++; } renderCal(); });
document.getElementById('calToday').addEventListener('click', ()=>{
  calY = now.getFullYear(); calM = now.getMonth();
  selY = calY; selM = calM; selD = now.getDate();
  renderCal();
});

/* ================= 顶部「空气」小组件：飘浮泡泡 ================= */
(function(){
  const wrap = document.getElementById('airWidget');
  const cv   = document.getElementById('airCanvas');
  if(!wrap || !cv) return;
  const ctx = cv.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  /* 颜色取背景极光里的青 / 紫 / 粉 / 薄荷 / 琥珀 / 藕蓝 */
  const PAL = [
    [56,189,248],[139,92,246],[236,72,153],[52,211,153],[245,158,11],[124,156,255]
  ];
  const WORDS = ['啵！','呼～','咕噜','噗','哈～','空气真好','✨','咻'];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, t = 0, last = 0;
  let bubbles = [], bits = [], rings = [], texts = [];
  const mouse = { x:-999, y:-999, on:false };

  const rnd = (a,b)=> a + Math.random()*(b-a);

  function makeBubble(fromBottom){
    const base = Math.max(2.6, Math.min(10, W/26));
    const r = base * rnd(.55, 1.15);
    return {
      x: rnd(r + 3, Math.max(r + 4, W - r - 3)),
      y: fromBottom ? H + rnd(3, 70) : rnd(0, Math.max(6, H)),
      r: r,
      vy: rnd(10, 24),                 /* 上升速度 px/s */
      sway: rnd(6, 17),                /* 左右摆动幅度 */
      ph: rnd(0, Math.PI*2),
      c: PAL[(Math.random()*PAL.length)|0],
      hot: 0                           /* 被鼠标推开时的高亮余温 */
    };
  }
  function resize(){
    W = wrap.clientWidth; H = wrap.clientHeight;
    if(!W || !H) return;
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.max(3, Math.min(9, Math.round(W / 48)));
    bubbles = [];
    for(let i = 0; i < n; i++) bubbles.push(makeBubble(false));
  }

  function pop(b){
    const c = b.c;
    for(let i = 0; i < 10; i++){
      const a = Math.random()*Math.PI*2, s = rnd(24, 84);
      bits.push({
        x:b.x, y:b.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 14,
        r:rnd(.9, 2.3), life:rnd(.35, .75), max:.75, c:c
      });
    }
    rings.push({ x:b.x, y:b.y, r:b.r, life:1, c:c });
    texts.push({ x:b.x, y:b.y - b.r - 5, life:.9, txt: WORDS[(Math.random()*WORDS.length)|0] });
    Object.assign(b, makeBubble(true));   /* 戳破后从底下重新飘一颗上来 */
  }

  function step(dt){
    bubbles.forEach(b=>{
      b.y -= b.vy * dt;
      b.x += Math.sin(t*0.9 + b.ph) * b.sway * dt;
      if(mouse.on){
        const dx = b.x - mouse.x, dy = b.y - mouse.y;
        const d = Math.hypot(dx, dy) || 1;
        const R = 60;
        if(d < R){                          /* 鼠标像一阵风，把泡泡吹开 */
          const p = (R - d) / R;
          b.x += (dx/d) * p * 52 * dt;
          b.y += (dy/d) * p * 52 * dt;
          b.hot = Math.min(1, b.hot + dt*4);
        } else b.hot = Math.max(0, b.hot - dt*2.2);
      } else b.hot = Math.max(0, b.hot - dt*2.2);

      if(b.x < b.r) b.x = b.r;
      else if(b.x > W - b.r) b.x = W - b.r;
      if(b.y < -b.r*1.5) Object.assign(b, makeBubble(true));
    });

    bits.forEach(p=>{ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 46*dt; p.life -= dt; });
    bits = bits.filter(p=> p.life > 0);
    rings.forEach(r=>{ r.r += 82*dt; r.life -= dt*1.7; });
    rings = rings.filter(r=> r.life > 0);
    texts.forEach(x=>{ x.y -= 17*dt; x.life -= dt; });
    texts = texts.filter(x=> x.life > 0);
  }

  function drawBubble(b){
    const c = b.c, R = b.r;
    const g = ctx.createRadialGradient(b.x - R*.34, b.y - R*.4, R*.08, b.x, b.y, R);
    g.addColorStop(0,   'rgba(255,255,255,' + (0.30 + b.hot*0.35).toFixed(3) + ')');
    g.addColorStop(.45, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (0.26 + b.hot*0.34).toFixed(3) + ')');
    g.addColorStop(1,   'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');
    ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (0.48 + b.hot*0.42).toFixed(3) + ')';
    ctx.stroke();
    ctx.beginPath();                                     /* 左上高光点 */
    ctx.arc(b.x - R*.34, b.y - R*.38, Math.max(1, R*.2), 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + b.hot*0.4).toFixed(3) + ')';
    ctx.fill();
  }

  function render(){
    ctx.clearRect(0, 0, W, H);
    /* 涟漪 */
    rings.forEach(r=>{
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(' + r.c[0] + ',' + r.c[1] + ',' + r.c[2] + ',' + (r.life*0.5).toFixed(3) + ')';
      ctx.stroke();
    });
    /* 碎屑 */
    bits.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(' + p.c[0] + ',' + p.c[1] + ',' + p.c[2] + ',' + (p.life/p.max*0.95).toFixed(3) + ')';
      ctx.fill();
    });
    bubbles.forEach(drawBubble);
    /* 拟声词 */
    ctx.textAlign = 'center';
    ctx.font = '600 11px "PingFang SC","Microsoft YaHei",sans-serif';
    texts.forEach(x=>{
      ctx.fillStyle = 'rgba(234,240,255,' + Math.max(0, Math.min(1, x.life)).toFixed(3) + ')';
      ctx.fillText(x.txt, x.x, x.y);
    });
  }

  function frame(ts){
    if(!last) last = ts;
    const dt = Math.min(0.05, (ts - last)/1000);
    last = ts; t += dt;
    step(dt); render();
    requestAnimationFrame(frame);
  }

  wrap.addEventListener('pointermove', e=>{
    const r = wrap.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.on = true;
  });
  wrap.addEventListener('pointerleave', ()=>{ mouse.on = false; mouse.x = mouse.y = -999; });
  wrap.addEventListener('pointerdown', e=>{
    const r = wrap.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    let hit = null, best = 1e9;
    bubbles.forEach(b=>{
      const d = Math.hypot(b.x - px, b.y - py);
      if(d < b.r + 9 && d < best){ best = d; hit = b; }
    });
    if(hit) pop(hit);
    else {                                   /* 戳空 = 吹一口气 */
      rings.push({ x:px, y:py, r:3, life:.8, c:[200,214,255] });
      texts.push({ x:px, y:py - 6, life:.75, txt:'呼～' });
    }
  });

  resize();
  if(reduce) render(); else requestAnimationFrame(frame);
  window.addEventListener('resize', ()=>{ resize(); if(reduce) render(); });
})();

/* ================= 底部动态波纹 ================= */
(function(){
  const svg = document.getElementById('waveSvg');
  if(!svg) return;
  const W = 1200, H = 92, CY = H / 2;
  /* 线宽整体收细（主亮线 3.4 → 1.4）；配色改为「青 / 紫 / 粉」低饱和微光，与背景极光同源 */
  const layers = [
    { k1:4, k2:9, amp:11, base:CY-4,  w:13,  sig:6, color:'rgba(56,189,248,.16)',  dur:26, rev:true  },
    { k1:3, k2:7, amp:9,  base:CY+8,  w:5,   sig:4, color:'rgba(139,92,246,.20)',  dur:20, rev:false },
    { k1:5, k2:3, amp:10, base:CY+2,  w:1.4, sig:0, color:'rgba(165,214,255,.72)', dur:16, rev:true  },
    { k1:2, k2:6, amp:14, base:CY-12, w:1,   sig:0, color:'rgba(167,139,250,.42)', dur:24, rev:false },
    { k1:6, k2:2, amp:7,  base:CY+20, w:0.9, sig:0, color:'rgba(244,114,182,.30)', dur:30, rev:true  },
  ];
  let out = '<defs>';
  layers.forEach((L, i)=>{
    if(L.sig) out += '<filter id="wb' + i + '" x="-10%" y="-200%" width="120%" height="500%">' +
                     '<feGaussianBlur stdDeviation="' + L.sig + '"/></filter>';
  });
  out += '</defs>';
  layers.forEach((L, i)=>{
    const p1 = i * 1.37, p2 = i * 2.21;
    let d = '';
    /* 画满三屏（-W ~ 2W）：动画只平移一屏，可见窗口永远落在中间那一屏里 → 两端永远看不到线头 */
    for(let x = -W; x <= W * 2 + 200; x += 10){
      const y = L.base
        + L.amp * Math.sin((x / W) * L.k1 * Math.PI * 2 + p1)
        + L.amp * 0.38 * Math.sin((x / W) * L.k2 * Math.PI * 2 + p2);
      d += (x === -W ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(2) + ' ';
    }
    out += '<g class="wscroll" style="animation-duration:' + L.dur + 's;' +
             (L.rev ? 'animation-direction:reverse;' : '') + '">' +
             '<path class="wline" d="' + d.trim() + '" stroke="' + L.color + '" stroke-width="' + L.w + '"' +
             (L.sig ? ' filter="url(#wb' + i + ')"' : '') + '/>' +
           '</g>';
  });
  svg.innerHTML = out;
})();
/* 波纹画完后重量一次手机尺寸（首屏脚本执行时可能还没排版完） */
fitPhone();
</script>
